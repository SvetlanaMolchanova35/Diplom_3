[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --alluredir=allure-results
    --reruns 1
    --reruns-delay 2
    -p no:warnings
markers =
    smoke: smoke tests
    regression: regression tests
    ui: ui tests
    slow: slow tests
    chrome: tests for chrome browser
    firefox: tests for firefox browser
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S